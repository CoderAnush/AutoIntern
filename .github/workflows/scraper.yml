name: Daily Job Scraper

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/scraper/requirements.txt 2>/dev/null || echo "⚠️  Scraper requirements optional"
          pip install requests beautifulsoup4 lxml httpx

      - name: Run Comprehensive Job Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python services/api/fetch_comprehensive_jobs.py
        continue-on-error: true

      - name: Import Jobs into Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/import_jobs.py services/api/jobs.json 2>/dev/null || echo "⚠️  No jobs to import"
        continue-on-error: true

      - name: Run Fallback Scraper
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python services/api/fetch_realtime_jobs.py 2>/dev/null || echo "⚠️  Fallback scraper skipped"
        continue-on-error: true

      - name: Report Status
        if: always()
        run: |
          echo "✅ Daily job scraper workflow completed"
