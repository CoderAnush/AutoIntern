name: Daily Job Scraper

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd AutoIntern/services/scraper
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Comprehensive Job Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd AutoIntern/services/api
          python fetch_comprehensive_jobs.py

      - name: Import Jobs into Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd AutoIntern
          python scripts/import_jobs.py

      - name: Run Fallback Scraper (if needed)
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd AutoIntern/services/api
          python fetch_realtime_jobs.py || true

      - name: Report Status
        if: always()
        run: |
          echo "Scraping job completed with status: ${{ job.status }}"
